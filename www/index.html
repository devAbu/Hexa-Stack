<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101a33">
<title>Hexa Stack</title>
<style>
  :root { --bg1:#1a2a52; --bg2:#0b1226; --ink:#eaf1ff; --mut:#8fa3cf; --acc:#3ee0c0; --acc2:#2a9df4; --card:rgba(255,255,255,.07); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body { margin:0; height:100%; overflow:hidden; color:var(--ink);
    background: radial-gradient(120% 90% at 50% 20%, var(--bg1), var(--bg2));
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { position:absolute; inset:0; display:block; touch-action:none; }
  .screen { position:fixed; inset:0; display:none; }
  .screen.on { display:flex; }
  .col { flex-direction:column; align-items:center; justify-content:center; gap:14px;
    padding: calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 16px); }

  h1 { margin:0 0 6px; font-size:44px; letter-spacing:1px; font-weight:800;
    background:linear-gradient(90deg,var(--acc),var(--acc2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  h2 { margin:0 0 8px; font-size:26px; font-weight:800; text-align:center; }
  .logo { width:120px; height:120px; margin-bottom:4px; }

  .btn { width:min(300px,86vw); min-height:54px; border:0; border-radius:16px; font-size:19px; font-weight:700; color:var(--ink);
    background:var(--card); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.12); padding:0 18px; cursor:pointer; }
  .btn:active { transform:scale(.97); }
  .btn.primary { color:#07202a; background:linear-gradient(180deg,#5cf0d2,#2fc9ad); box-shadow:0 4px 0 #1b8e7a; }
  .btn.ad { color:#2b1b00; background:linear-gradient(180deg,#ffd666,#ffb020); box-shadow:0 4px 0 #b97a00; }
  .btn.ad[disabled] { opacity:.55; }
  .btn.small { min-height:46px; font-size:16px; }
  .row { display:flex; gap:10px; }
  .coins { position:absolute; right:14px; top:calc(env(safe-area-inset-top) + 12px); font-weight:800; color:#ffd666; display:flex; gap:6px; align-items:center; }

  /* level grid */
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; width:min(340px,92vw); }
  .lv { aspect-ratio:1; border:0; border-radius:14px; background:var(--card); color:var(--ink); font-size:22px; font-weight:800;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.12); }
  .lv.cur { background:linear-gradient(180deg,#5cf0d2,#2fc9ad); color:#07202a; }
  .lv[disabled] { opacity:.35; }
  .stars { font-size:0; display:flex; gap:2px; height:12px; }
  .stars svg { width:12px; height:12px; }

  /* lists / settings */
  .list { width:min(340px,92vw); display:flex; flex-direction:column; gap:8px; }
  .item { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-radius:14px; background:var(--card); font-size:17px; font-weight:600; }
  .item .rank { color:var(--mut); width:28px; }
  .toggle { min-width:64px; height:34px; border-radius:17px; border:0; font-weight:800; color:#07202a; background:var(--acc); }
  .toggle.off { background:#55627f; color:#c7d2ee; }
  .muted { color:var(--mut); font-size:16px; text-align:center; }

  /* game hud */
  #hud { position:absolute; top:0; left:0; right:0; display:flex; align-items:center; gap:10px;
    padding: calc(env(safe-area-inset-top) + 8px) 12px 6px; pointer-events:none; }
  #hud > * { pointer-events:auto; }
  .round { width:46px; height:46px; border-radius:50%; border:0; background:var(--card); color:var(--ink); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.14); display:flex; align-items:center; justify-content:center; }
  .round svg { width:22px; height:22px; }
  #hudMid { flex:1; text-align:center; min-width:0; }
  #hudTitle { font-size:15px; font-weight:700; color:var(--mut); }
  #bar { height:16px; border-radius:8px; background:rgba(255,255,255,.1); overflow:hidden; margin-top:4px; position:relative; }
  #barFill { height:100%; width:0%; background:linear-gradient(90deg,var(--acc),var(--acc2)); transition:width .35s ease; }
  #barText { position:absolute; inset:0; font-size:12px; font-weight:800; line-height:16px; text-shadow:0 1px 2px rgba(0,0,0,.6); }
  #hudRight { min-width:64px; text-align:center; padding:4px 8px; border-radius:12px; background:var(--card); }
  #hudRightLbl { font-size:11px; color:var(--mut); font-weight:700; text-transform:uppercase; }
  #hudRightVal { font-size:22px; font-weight:800; line-height:24px; }
  #hudRightVal.low { color:#ff7a6b; }

  #tools { position:absolute; left:0; right:0; display:flex; justify-content:center; gap:12px; }
  .tool { position:relative; width:84px; height:56px; border-radius:16px; border:0; color:var(--ink); background:var(--card);
    box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.14); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; font-size:11px; font-weight:800; }
  .tool svg { width:26px; height:26px; }
  .tool:active { transform:scale(.96); }
  .tool[disabled] { opacity:.45; }
  .tool.armed { background:linear-gradient(180deg,#ff9e6b,#ff6b4a); color:#2b0b00; }
  .tool .tag { position:absolute; top:-6px; right:-4px; padding:1px 6px; border-radius:8px; font-size:10px; background:#ffb020; color:#2b1b00; }
  .tool .tag.n { background:#ff6b4a; color:#fff; }

  #overlay { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(5,9,20,.72); z-index:10; }
  #overlay.on { display:flex; }
  .card { width:min(340px,90vw); padding:22px 18px; border-radius:24px; background:linear-gradient(180deg,#26386b,#17234a);
    box-shadow:0 10px 40px rgba(0,0,0,.5), inset 0 0 0 1.5px rgba(255,255,255,.12); display:flex; flex-direction:column; align-items:center; gap:12px; }
  .card .btn { width:100%; }
  .big { font-size:40px; font-weight:800; }
  .gold { color:#ffd666; font-weight:800; }
  .starrow { display:flex; gap:8px; }
  .starrow svg { width:48px; height:48px; }
</style>
</head>
<body>

<!-- GAME -->
<div id="game" class="screen">
  <canvas id="c"></canvas>
  <div id="hud">
    <button id="btnPause" class="round" aria-label="pause"></button>
    <div id="hudMid">
      <div id="hudTitle"></div>
      <div id="bar"><div id="barFill"></div><div id="barText"></div></div>
    </div>
    <div id="hudRight"><div id="hudRightLbl"></div><div id="hudRightVal"></div></div>
  </div>
  <div id="tools">
    <button id="toolSwap" class="tool"></button>
    <button id="toolBomb" class="tool"></button>
    <button id="toolMoves" class="tool"></button>
  </div>
</div>

<!-- MENU -->
<div id="menu" class="screen col">
  <div class="coins" id="menuCoins"></div>
  <svg class="logo" viewBox="0 0 120 120" id="logo"></svg>
  <h1 data-s="title"></h1>
  <button id="mPlay" class="btn primary"></button>
  <button id="mEndless" class="btn" data-s="endless"></button>
  <button id="mLevels" class="btn" data-s="levels"></button>
  <button id="mScores" class="btn" data-s="bestScores"></button>
  <button id="mSettings" class="btn" data-s="settings"></button>
</div>

<!-- LEVELS -->
<div id="levels" class="screen col">
  <h2 data-s="levels"></h2>
  <div class="grid" id="levelGrid"></div>
  <button class="btn small back" data-s="back"></button>
</div>

<!-- SCORES -->
<div id="scores" class="screen col">
  <h2 data-s="bestScores"></h2>
  <div class="list" id="scoreList"></div>
  <button class="btn small back" data-s="back"></button>
</div>

<!-- SETTINGS -->
<div id="settings" class="screen col">
  <h2 data-s="settings"></h2>
  <div class="list">
    <div class="item"><span data-s="music"></span><button class="toggle" id="tMusic"></button></div>
    <div class="item"><span data-s="sfx"></span><button class="toggle" id="tSfx"></button></div>
    <div class="item"><span data-s="vibration"></span><button class="toggle" id="tVibe"></button></div>
  </div>
  <button class="btn small back" data-s="back"></button>
</div>

<div id="overlay"><div class="card" id="card"></div></div>

<script src="strings.js"></script>
<script src="storage.js"></script>
<script src="core.js"></script>
<script src="adservice.js"></script>
<script src="audio.js"></script>
<script src="main.js"></script>
</body>
</html>
